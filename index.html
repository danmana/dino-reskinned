<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f7" />
    <title>Dino, Reskinned</title>
    <meta name="description" content="The Chrome offline dinosaur game in eleven pixel-art worlds, with a skin designer. Switch worlds mid-run." />
    <meta property="og:title" content="Dino, Reskinned" />
    <meta property="og:description" content="The Chrome offline runner in eleven pixel-art worlds. Switch skins mid-run, or make your own in a minute." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div class="page" id="page">
      <header class="masthead">
        <h1 class="wordmark" id="wordmark" aria-label="Dino, Reskinned"></h1>
        <div class="switches">
          <label class="switch" title="Let the computer play (A)">
            <input type="checkbox" id="autoplay" />
            <span class="box" aria-hidden="true"></span>
            <span>Autoplay</span>
            <kbd>A</kbd>
          </label>
          <button class="switch" id="sound" type="button" aria-pressed="true" title="Sound on or off (M)">
            <span class="box" aria-hidden="true"></span>
            <span>Sound</span>
            <kbd>M</kbd>
          </button>
        </div>
      </header>

      <section class="stage" id="stage" aria-label="Game">
        <canvas id="game" aria-label="Runner game. Press space to jump, down arrow to duck."></canvas>
        <div class="pads" id="pads">
          <button type="button" class="pad" id="padDuck" aria-label="Duck">
            <svg viewBox="0 0 7 5" aria-hidden="true" shape-rendering="crispEdges"><path d="M0 0h7v1H6v1H5v1H4v1H3V3H2V2H1V1H0z" fill="currentColor"/></svg>
            Duck
          </button>
          <button type="button" class="pad" id="padJump" aria-label="Jump">
            <svg viewBox="0 0 7 5" aria-hidden="true" shape-rendering="crispEdges"><path d="M3 0h1v1h1v1h1v1h1v1H0V3h1V2h1V1h1z" fill="currentColor" transform="translate(0 1)"/></svg>
            Jump
          </button>
        </div>
      </section>

      <section class="now" aria-live="polite">
        <button type="button" class="step" id="prev" aria-label="Previous skin" title="Previous skin (←)">
          <svg viewBox="0 0 5 7" aria-hidden="true" shape-rendering="crispEdges"><path d="M3 0h1v1H3v1H2v1H1v1h1v1h1v1h1v1H3V6H2V5H1V4H0V3h1V2h1V1h1z" fill="currentColor"/></svg>
        </button>
        <div class="now-text">
          <h2 class="skin-name" id="skinName"></h2>
          <p class="tagline" id="skinTag"></p>
        </div>
        <button type="button" class="step" id="next" aria-label="Next skin" title="Next skin (→)">
          <svg viewBox="0 0 5 7" aria-hidden="true" shape-rendering="crispEdges"><path d="M1 0h1v1h1v1h1v1h1v1H4v1H3v1H2v1H1V6h1V5h1V4h1V3H3V2H2V1H1z" fill="currentColor"/></svg>
        </button>
        <div class="now-actions">
          <button type="button" class="btn" id="edit" hidden>Edit skin</button>
          <button type="button" class="btn primary" id="make">Make your own</button>
        </div>
      </section>

      <nav class="rail" id="rail" aria-label="Skins"></nav>

      <footer class="keys">
        <p class="desk"><kbd>Space</kbd> or <kbd>↑</kbd> jumps. Hold it for a higher jump.</p>
        <p class="desk"><kbd>↓</kbd> ducks, or drops you fast mid-air.</p>
        <p class="desk"><kbd>←</kbd> <kbd>→</kbd> switch skins mid-run. <kbd>1</kbd> to <kbd>0</kbd> pick one.</p>
        <p class="touch-only">Tap the game to jump. Swipe along the skins to change worlds.</p>
        <p class="credit">A love letter to Chrome's offline dinosaur. Not affiliated with Google.</p>
      </footer>
    </div>

    <aside class="designer" id="designer" aria-label="Skin designer" hidden></aside>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
